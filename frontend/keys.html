<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Keys — API Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','-apple-system','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="font-sans antialiased bg-slate-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        API Platform
      </a>
      <!-- Desktop Nav -->
      <div class="hidden sm:flex items-center gap-6">
        <a href="/dashboard.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Dashboard</a>
        <a href="/keys.html" class="nav-link active text-sm font-medium text-sky-600">API Keys</a>
        <a href="/plans.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Plans</a>
        <a href="/playground.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-slate-200">
          <span id="user-name" class="text-sm text-slate-600"></span>
          <button id="logout-btn"
            class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors">Logout</button>
        </div>
      </div>
      <!-- Mobile Hamburger -->
      <button id="mobile-menu-btn" class="sm:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/20" onclick="closeMobileMenu()"></div>
    <div class="absolute right-0 top-0 h-full w-64 bg-white shadow-xl p-6 transform transition-transform">
      <div class="flex justify-end mb-6">
        <button onclick="closeMobileMenu()" class="p-2 rounded-lg text-slate-400 hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex flex-col gap-3">
        <span id="mobile-user-name" class="text-sm font-medium text-slate-800 mb-2"></span>
        <a href="/dashboard.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Dashboard</a>
        <a href="/keys.html" class="text-sm font-medium text-sky-600 bg-sky-50 px-3 py-2 rounded-lg">API Keys</a>
        <a href="/plans.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Plans</a>
        <a href="/playground.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Playground</a>
        <hr class="border-slate-200 my-2" />
        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700 font-medium text-left px-3 py-2">Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-slate-800">API Keys</h2>
      <button id="generate-btn"
        class="bg-sky-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-sky-700 shadow-sm shadow-sky-200 transition-all">
        Generate New API Key
      </button>
    </div>

    <!-- Gen Error -->
    <div id="gen-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm"></div>

    <!-- New Key Alert -->
    <div id="key-alert" class="hidden mb-6 p-4 rounded-xl border border-amber-300 bg-amber-50">
      <p class="text-sm font-semibold text-amber-800 mb-2">
        Your new API key (shown only once):
      </p>
      <div class="flex items-center gap-2">
        <code id="key-value" class="flex-1 block bg-white px-4 py-2 rounded-lg font-mono text-sm text-slate-800 border border-amber-200 break-all select-all"></code>
        <button id="copy-btn"
          class="shrink-0 bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-amber-700 transition-all flex items-center gap-1.5">
          <svg id="copy-icon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span id="copy-label">Copy</span>
        </button>
      </div>
      <p class="text-xs text-amber-700 mt-2">Store this key securely. It will not be shown again.</p>
    </div>

    <!-- Keys Table -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
      <table class="w-full">
        <thead class="bg-slate-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Key ID</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Created</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-slate-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="keys-body">
          <tr>
            <td colspan="4" class="px-6 py-8 text-center text-slate-400">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/keys.js"></script>
  <script>
    // Mobile menu
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.remove('hidden');
    });
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.add('hidden');
    }
  </script>
</body>
</html>
