<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground — API Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-indigo-600">API Platform</a>
      <div class="flex items-center gap-6">
        <span id="auth-nav" class="hidden contents">
          <a href="/dashboard.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">Dashboard</a>
          <a href="/keys.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">API Keys</a>
        </span>
        <a href="/playground.html" class="nav-link active text-sm font-medium text-indigo-600">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-gray-200">
          <span id="user-name" class="text-sm text-gray-600"></span>
          <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700 font-medium hidden">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">API Playground</h2>
    <p class="text-gray-500 mb-6">Test your API key by calling the content endpoints.</p>

    <!-- API Key Input -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Your API Key</label>
      <input id="api-key-input" type="text" placeholder="Paste your API key here…"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />

      <div class="flex gap-3 mt-4">
        <button id="quote-btn"
          class="flex-1 bg-indigo-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
          Get Random Quote
        </button>
        <button id="joke-btn"
          class="flex-1 bg-purple-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-purple-700 transition">
          Get Random Joke
        </button>
      </div>
    </div>

    <!-- Error -->
    <div id="pg-error" class="hidden mb-6 p-4 rounded-lg bg-red-50 text-red-700 text-sm font-medium"></div>

    <!-- Result -->
    <div id="result-box" class="hidden bg-white rounded-xl shadow-sm p-6">
      <p class="text-xs font-semibold text-gray-400 uppercase tracking-wide mb-3">Response</p>
      <pre id="result-json" class="bg-gray-900 text-green-400 p-4 rounded-lg text-sm overflow-x-auto font-mono"></pre>
      <p id="rate-info" class="hidden mt-3 text-sm font-medium text-green-600"></p>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/playground.js"></script>
</body>
</html>
