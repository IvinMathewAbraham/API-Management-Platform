<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground — API Platform</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{fontFamily:{sans:['Inter','system-ui','-apple-system','sans-serif']}}}}</script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="font-sans antialiased bg-slate-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        API Platform
      </a>
      <!-- Desktop Nav -->
      <div class="hidden sm:flex items-center gap-6">
        <span id="auth-nav" class="hidden contents">
          <a href="/dashboard.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Dashboard</a>
          <a href="/keys.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">API Keys</a>
          <a href="/plans.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Plans</a>
        </span>
        <a href="/playground.html" class="nav-link active text-sm font-medium text-sky-600">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-slate-200">
          <span id="user-name" class="text-sm text-slate-600"></span>
          <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors hidden">Logout</button>
        </div>
      </div>
      <!-- Mobile Hamburger -->
      <button id="mobile-menu-btn" class="sm:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/20" onclick="closeMobileMenu()"></div>
    <div class="absolute right-0 top-0 h-full w-64 bg-white shadow-xl p-6 transform transition-transform">
      <div class="flex justify-end mb-6">
        <button onclick="closeMobileMenu()" class="p-2 rounded-lg text-slate-400 hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex flex-col gap-3">
        <span id="mobile-user-name" class="text-sm font-medium text-slate-800 mb-2"></span>
        <span id="mobile-auth-nav" class="hidden contents">
          <a href="/dashboard.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Dashboard</a>
          <a href="/keys.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">API Keys</a>
          <a href="/plans.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Plans</a>
        </span>
        <a href="/playground.html" class="text-sm font-medium text-sky-600 bg-sky-50 px-3 py-2 rounded-lg">Playground</a>
        <hr class="border-slate-200 my-2" />
        <button id="mobile-logout-btn" onclick="logout()" class="text-sm text-red-500 hover:text-red-700 font-medium text-left px-3 py-2 hidden">Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-slate-800 mb-2">API Playground</h2>
    <p class="text-slate-500 mb-6">Test your API key by calling the content endpoints.</p>

    <!-- API Key Input -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 mb-6">
      <label class="block text-sm font-medium text-slate-700 mb-2">Your API Key</label>
      <input id="api-key-input" type="text" placeholder="Paste your API key here…"
        class="w-full px-4 py-2.5 border border-slate-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-sky-500 focus:border-transparent outline-none transition" />

      <div class="flex gap-3 mt-4">
        <button id="quote-btn"
          class="flex-1 bg-sky-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-sky-700 shadow-sm shadow-sky-200 transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
          Get Random Quote
        </button>
        <button id="joke-btn"
          class="flex-1 bg-slate-700 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-slate-800 transition-all flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Get Random Joke
        </button>
      </div>
    </div>

    <!-- Error -->
    <div id="pg-error" class="hidden mb-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium"></div>

    <!-- Result -->
    <div id="result-box" class="hidden">
      <!-- Response header bar -->
      <div class="response-header flex items-center justify-between px-5 py-3 bg-slate-800 rounded-t-xl">
        <div class="flex items-center gap-3">
          <span id="resp-method" class="px-2 py-0.5 text-xs font-bold rounded bg-emerald-500/20 text-emerald-400 tracking-wide">GET</span>
          <span id="resp-endpoint" class="text-sm font-mono text-slate-400">/api/v1/quotes</span>
          <span id="resp-status" class="px-2 py-0.5 text-xs font-semibold rounded bg-emerald-500/20 text-emerald-400">200 OK</span>
        </div>
        <div class="flex items-center gap-4">
          <span id="resp-time" class="text-xs text-slate-500 font-mono hidden"></span>
          <button id="copy-response-btn" class="flex items-center gap-1.5 text-xs text-slate-400 hover:text-white transition" title="Copy JSON">
              <svg id="copy-resp-icon" class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            <span id="copy-response-label">Copy</span>
          </button>
        </div>
      </div>

      <!-- JSON body -->
      <div class="response-body bg-slate-900 px-5 py-4 rounded-b-xl overflow-x-auto">
        <pre id="result-json" class="text-sm font-mono leading-relaxed json-output"></pre>
      </div>

      <!-- Rate limit info -->
      <div id="rate-info-bar" class="hidden mt-3 flex items-center gap-2">
        <div class="flex-1 h-1.5 bg-slate-200 rounded-full overflow-hidden">
          <div id="rate-bar" class="h-full rounded-full transition-all duration-500 bg-emerald-500" style="width:0%"></div>
        </div>
        <p id="rate-info" class="text-xs font-medium text-slate-500 whitespace-nowrap"></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/playground.js"></script>
  <script>
    // Mobile menu
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.remove('hidden');
    });
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.add('hidden');
    }
  </script>
</body>
</html>
