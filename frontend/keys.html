<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Keys — API Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-indigo-600">API Platform</a>
      <div class="flex items-center gap-6">
        <a href="/dashboard.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">Dashboard</a>
        <a href="/keys.html" class="nav-link active text-sm font-medium text-indigo-600">API Keys</a>
        <a href="/playground.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-gray-200">
          <span id="user-name" class="text-sm text-gray-600"></span>
          <button id="logout-btn"
            class="text-sm text-red-500 hover:text-red-700 font-medium">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div class="flex items-center justify-between mb-6">
      <h2 class="text-2xl font-bold text-gray-800">API Keys</h2>
      <button id="generate-btn"
        class="bg-indigo-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-indigo-700 transition">
        Generate New API Key
      </button>
    </div>

    <!-- Gen Error -->
    <div id="gen-error" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"></div>

    <!-- New Key Alert -->
    <div id="key-alert" class="hidden mb-6 p-4 rounded-xl border border-yellow-300 bg-yellow-50">
      <p class="text-sm font-semibold text-yellow-800 mb-2">
        Your new API key (shown only once):
      </p>
      <div class="flex items-center gap-2">
        <code id="key-value" class="flex-1 block bg-white px-4 py-2 rounded-lg font-mono text-sm text-gray-800 border border-yellow-200 break-all select-all"></code>
        <button id="copy-btn"
          class="shrink-0 bg-yellow-600 text-white px-4 py-2 rounded-lg text-sm font-medium hover:bg-yellow-700 transition">
          Copy
        </button>
      </div>
      <p class="text-xs text-yellow-700 mt-2">Store this key securely. It will not be shown again.</p>
    </div>

    <!-- Keys Table -->
    <div class="bg-white rounded-xl shadow-sm overflow-hidden">
      <table class="w-full">
        <thead class="bg-gray-50">
          <tr>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Key ID</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Status</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Created</th>
            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-500 uppercase tracking-wider">Actions</th>
          </tr>
        </thead>
        <tbody id="keys-body">
          <tr>
            <td colspan="3" class="px-6 py-8 text-center text-gray-400">Loading…</td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/keys.js"></script>
</body>
</html>
