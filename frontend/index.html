<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API Management Platform — Sign In</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
  <div class="w-full max-w-md">
    <!-- Logo / Heading -->
    <div class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-600">API Platform</h1>
      <p class="text-gray-500 mt-1">Manage your API keys and usage</p>
    </div>

    <!-- Card -->
    <div class="bg-white rounded-xl shadow-md overflow-hidden">
      <!-- Tabs -->
      <div class="flex border-b">
        <button id="register-tab"
          class="flex-1 py-3 text-center text-sm font-medium border-b-2 border-indigo-500 text-indigo-600 focus:outline-none">
          Register
        </button>
        <button id="login-tab"
          class="flex-1 py-3 text-center text-sm font-medium border-b-2 border-transparent text-gray-500 hover:text-gray-700 focus:outline-none">
          Login
        </button>
      </div>

      <div class="p-6">
        <!-- Error -->
        <div id="error-box" class="hidden mb-4 p-3 rounded-lg bg-red-50 text-red-700 text-sm"></div>

        <!-- Register Form -->
        <form id="register-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
            <input id="reg-name" type="text" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="reg-email" type="email" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="reg-password" type="password" required minlength="6"
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
          </div>
          <button type="submit"
            class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
            Create Account
          </button>
        </form>

        <!-- Login Form -->
        <form id="login-form" class="space-y-4 hidden">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
            <input id="login-email" type="email" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input id="login-password" type="password" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />
          </div>
          <button type="submit"
            class="w-full bg-indigo-600 text-white py-2.5 rounded-lg font-medium hover:bg-indigo-700 transition">
            Sign In
          </button>
        </form>
      </div>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6">API Management Platform &copy; 2026</p>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
