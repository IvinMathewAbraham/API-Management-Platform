<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — API Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-slate-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm border-b border-slate-100">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <span class="w-2 h-2 rounded-full bg-sky-500"></span>
        API Platform
      </a>
      <!-- Desktop Nav -->
      <div class="hidden sm:flex items-center gap-6">
        <a href="/dashboard.html" class="nav-link active text-sm font-medium text-sky-600">Dashboard</a>
        <a href="/keys.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">API Keys</a>
        <a href="/plans.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Plans</a>
        <a href="/playground.html" class="nav-link text-sm font-medium text-slate-500 hover:text-slate-700 transition-colors">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-slate-200">
          <span id="user-name" class="text-sm text-slate-600"></span>
          <button id="logout-btn"
            class="text-sm text-red-500 hover:text-red-700 font-medium transition-colors">Logout</button>
        </div>
      </div>
      <!-- Mobile Hamburger -->
      <button id="mobile-menu-btn" class="sm:hidden p-2 rounded-lg text-slate-500 hover:bg-slate-100 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
    </div>
  </nav>

  <!-- Mobile Menu Overlay -->
  <div id="mobile-menu" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-black/20" onclick="closeMobileMenu()"></div>
    <div class="absolute right-0 top-0 h-full w-64 bg-white shadow-xl p-6 transform transition-transform">
      <div class="flex justify-end mb-6">
        <button onclick="closeMobileMenu()" class="p-2 rounded-lg text-slate-400 hover:bg-slate-100">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      <div class="flex flex-col gap-3">
        <span id="mobile-user-name" class="text-sm font-medium text-slate-800 mb-2"></span>
        <a href="/dashboard.html" class="text-sm font-medium text-sky-600 bg-sky-50 px-3 py-2 rounded-lg">Dashboard</a>
        <a href="/keys.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">API Keys</a>
        <a href="/plans.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Plans</a>
        <a href="/playground.html" class="text-sm font-medium text-slate-600 hover:bg-slate-50 px-3 py-2 rounded-lg transition">Playground</a>
        <hr class="border-slate-200 my-2" />
        <button onclick="logout()" class="text-sm text-red-500 hover:text-red-700 font-medium text-left px-3 py-2">Sign Out</button>
      </div>
    </div>
  </div>

  <!-- Content -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-slate-800 mb-6">Usage Dashboard</h2>

    <div id="dashboard-error" class="hidden mb-6 p-4 rounded-lg bg-red-50 border border-red-200 text-red-700"></div>

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
      <!-- Plan -->
      <div class="stat-card bg-white rounded-xl border border-slate-200 shadow-sm p-6 border-l-4 border-l-sky-500" style="animation-delay: 0ms">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Current Plan</p>
        <span id="plan-badge" class="inline-block px-3 py-1 text-sm font-semibold rounded-full bg-slate-100 text-slate-800">—</span>
      </div>
      <!-- Total Requests -->
      <div class="stat-card bg-white rounded-xl border border-slate-200 shadow-sm p-6 border-l-4 border-l-emerald-500" style="animation-delay: 50ms">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Total Requests</p>
        <p id="total-requests" class="text-3xl font-bold text-slate-800" data-countup>—</p>
      </div>
      <!-- This Hour -->
      <div class="stat-card bg-white rounded-xl border border-slate-200 shadow-sm p-6 border-l-4 border-l-amber-500" style="animation-delay: 100ms">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Requests This Hour</p>
        <p id="requests-hour" class="text-3xl font-bold text-slate-800" data-countup>—</p>
      </div>
      <!-- Remaining -->
      <div class="stat-card bg-white rounded-xl border border-slate-200 shadow-sm p-6 border-l-4 border-l-slate-300" style="animation-delay: 150ms">
        <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Remaining This Hour</p>
        <p class="text-3xl font-bold text-slate-800">
          <span id="remaining" data-countup>—</span>
          <span class="text-base font-normal text-slate-400"> / <span id="limit">—</span></span>
        </p>
      </div>
    </div>

    <!-- Usage Bar -->
    <div class="bg-white rounded-xl border border-slate-200 shadow-sm p-6">
      <div class="flex items-center justify-between mb-3">
        <p class="text-sm font-medium text-slate-600">Hourly Usage</p>
        <span id="usage-pct" class="text-sm font-semibold text-slate-500"></span>
      </div>
      <div class="w-full bg-slate-200 rounded-full h-5 overflow-hidden">
        <div id="usage-bar" class="h-full rounded-full bg-emerald-500 transition-all duration-700 ease-out flex items-center justify-center" style="width: 0%">
          <span id="usage-bar-label" class="text-xs font-semibold text-white drop-shadow-sm"></span>
        </div>
      </div>
    </div>

    <!-- Upgrade Plan CTA -->
    <div id="upgrade-cta" class="bg-white rounded-xl border border-slate-200 shadow-sm p-6 mt-6 hidden">
      <div class="flex items-center justify-between">
        <div>
          <h3 class="text-lg font-semibold text-slate-800 mb-1">Want more requests?</h3>
          <p class="text-sm text-slate-500">Upgrade to Pro for <strong>1,000 requests/hour</strong> — 10x the free plan.</p>
        </div>
        <a href="/plans.html"
          class="shrink-0 ml-4 bg-sky-600 text-white px-5 py-2.5 rounded-lg text-sm font-medium hover:bg-sky-700 shadow-sm shadow-sky-200 transition-all flex items-center gap-2">
          Upgrade Plan
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/></svg>
        </a>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
  <script>
    // Mobile menu
    document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
      document.getElementById('mobile-menu').classList.remove('hidden');
    });
    function closeMobileMenu() {
      document.getElementById('mobile-menu').classList.add('hidden');
    }
  </script>
</body>
</html>
