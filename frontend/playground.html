<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Playground — API Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/css/styles.css" />
</head>
<body class="bg-gray-50 min-h-screen">
  <!-- Navbar -->
  <nav class="bg-white shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3 flex items-center justify-between">
      <a href="/dashboard.html" class="text-xl font-bold text-indigo-600">API Platform</a>
      <div class="flex items-center gap-6">
        <span id="auth-nav" class="hidden contents">
          <a href="/dashboard.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">Dashboard</a>
          <a href="/keys.html" class="nav-link text-sm font-medium text-gray-500 hover:text-gray-700">API Keys</a>
        </span>
        <a href="/playground.html" class="nav-link active text-sm font-medium text-indigo-600">Playground</a>
        <div class="flex items-center gap-3 ml-4 pl-4 border-l border-gray-200">
          <span id="user-name" class="text-sm text-gray-600"></span>
          <button id="logout-btn" class="text-sm text-red-500 hover:text-red-700 font-medium hidden">Logout</button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Content -->
  <main class="max-w-3xl mx-auto px-4 py-8">
    <h2 class="text-2xl font-bold text-gray-800 mb-2">API Playground</h2>
    <p class="text-gray-500 mb-6">Test your API key by calling the content endpoints.</p>

    <!-- API Key Input -->
    <div class="bg-white rounded-xl shadow-sm p-6 mb-6">
      <label class="block text-sm font-medium text-gray-700 mb-2">Your API Key</label>
      <input id="api-key-input" type="text" placeholder="Paste your API key here…"
        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg font-mono text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none" />

      <div class="flex gap-3 mt-4">
        <button id="quote-btn"
          class="flex-1 bg-emerald-600 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-emerald-700 transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"/></svg>
          Get Random Quote
        </button>
        <button id="joke-btn"
          class="flex-1 bg-amber-500 text-white py-2.5 rounded-lg text-sm font-medium hover:bg-amber-600 transition flex items-center justify-center gap-2">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.828 14.828a4 4 0 01-5.656 0M9 10h.01M15 10h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
          Get Random Joke
        </button>
      </div>
    </div>

    <!-- Error -->
    <div id="pg-error" class="hidden mb-6 p-4 rounded-lg bg-red-50 text-red-700 text-sm font-medium"></div>

    <!-- Result -->
    <div id="result-box" class="hidden">
      <!-- Response header bar -->
      <div class="response-header flex items-center justify-between px-5 py-3 bg-gray-800 rounded-t-xl">
        <div class="flex items-center gap-3">
          <span id="resp-method" class="px-2 py-0.5 text-xs font-bold rounded bg-emerald-500/20 text-emerald-400 tracking-wide">GET</span>
          <span id="resp-endpoint" class="text-sm font-mono text-gray-400">/api/v1/quotes</span>
          <span id="resp-status" class="px-2 py-0.5 text-xs font-semibold rounded bg-emerald-500/20 text-emerald-400">200 OK</span>
        </div>
        <button id="copy-response-btn" class="flex items-center gap-1.5 text-xs text-gray-400 hover:text-white transition" title="Copy JSON">
            <svg class="w-3.5 h-3.5 text-gray-300 hover:text-white" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
          <span id="copy-response-label">Copy</span>
        </button>
      </div>

      <!-- JSON body -->
      <div class="response-body bg-gray-900 px-5 py-4 rounded-b-xl overflow-x-auto">
        <pre id="result-json" class="text-sm font-mono leading-relaxed json-output"></pre>
      </div>

      <!-- Rate limit info -->
      <div id="rate-info-bar" class="hidden mt-3 flex items-center gap-2">
        <div class="flex-1 h-1.5 bg-gray-200 rounded-full overflow-hidden">
          <div id="rate-bar" class="h-full rounded-full transition-all duration-500 bg-emerald-500" style="width:0%"></div>
        </div>
        <p id="rate-info" class="text-xs font-medium text-gray-500 whitespace-nowrap"></p>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/playground.js"></script>
</body>
</html>
