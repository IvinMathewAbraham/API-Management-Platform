server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy — auth
    location /auth/ {
        proxy_pass http://app:5000/auth/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy — API keys
    location /apikey/ {
        proxy_pass http://app:5000/apikey/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy — dashboard API (specific sub-paths only, so /dashboard SPA route is served by index.html)
    location /dashboard/usage {
        proxy_pass http://app:5000/dashboard/usage;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /dashboard/analytics/ {
        proxy_pass http://app:5000/dashboard/analytics/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy — user management
    location /user/ {
        proxy_pass http://app:5000/user/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy — public content API
    location /api/ {
        proxy_pass http://app:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Reverse proxy — admin API + SPA fallback for admin pages
    # SPA routes and API routes share the same /admin/* paths, so we
    # differentiate by Authorization header: API calls include it,
    # browser page loads / refreshes do not.
    location /admin/ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Authenticated API calls — proxy to backend
        if ($http_authorization) {
            proxy_pass http://app:5000;
        }

        # Page requests (no auth header) — serve SPA
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy — health
    location = /health {
        proxy_pass http://app:5000/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
